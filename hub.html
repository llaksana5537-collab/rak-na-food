<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rak-Na Ecosystem | All-in-One Presentation Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #0B0F19;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Master Top Bar */
    header {
      background: #111827;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #00B14F, #10B981);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }
    .brand-title b {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: block;
      line-height: 1.2;
    }
    .brand-title small {
      font-size: 11px;
      color: #00B14F;
      font-weight: 600;
    }

    /* Hub View Tabs */
    .view-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 4px;
    }
    .view-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .view-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .view-btn.active {
      background: #00B14F;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 177, 79, 0.4);
    }
    .view-btn.admin-btn.active {
      background: #4F46E5;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }
    .view-btn.split-btn.active {
      background: #FF5A36;
      box-shadow: 0 2px 8px rgba(255, 90, 54, 0.4);
    }

    /* Actions right */
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ext-link-btn {
      color: #94A3B8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ext-link-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: #00B14F;
    }

    /* Main Stage */
    .stage-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0B0F19;
      position: relative;
    }

    /* Iframe Containers */
    .frame-single {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .frame-mobile-wrap {
      width: 440px;
      height: 96%;
      max-height: 920px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .frame-mobile-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Split Screen Mode */
    .stage-split {
      display: none;
      width: 100%;
      height: 100%;
      gap: 14px;
      padding: 14px;
    }
    .split-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #111827;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .split-col-header {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .split-col iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<header>
  <div class="brand-wrap">
    <div class="brand-badge">RN</div>
    <div class="brand-title">
      <b>รักนา แพลตฟอร์ม (Rak-Na Platform)</b>
      <small>All-in-One Presentation & Demo Hub</small>
    </div>
  </div>

  <div class="view-tabs">
    <button class="view-btn active" id="tab-customer" onclick="setMode('customer')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      แอปสั่งอาหารลูกค้า
    </button>
    <button class="view-btn" id="tab-merchant" onclick="setMode('merchant')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ระบบจัดการร้านค้า
    </button>
    <button class="view-btn admin-btn" id="tab-admin" onclick="setMode('admin')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      แอดมินกลาง
    </button>
    <button class="view-btn split-btn" id="tab-split" onclick="setMode('split')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      ทดสอบสั่งอาหาร ⇄ ร้านค้ารับออเดอร์สด (Split View)
    </button>
  </div>

  <div class="header-right">
    <a href="index.html" target="_blank" class="ext-link-btn" title="เปิดหน้าลูกค้าแยกแท็บ">
      <span>↗</span> หน้าลูกค้า
    </a>
    <a href="merchant.html" target="_blank" class="ext-link-btn" title="เปิดหน้าร้านค้าแยกแท็บ">
      <span>↗</span> หน้าร้านค้า
    </a>
    <a href="admin.html" target="_blank" class="ext-link-btn" title="เปิดหน้าแอดมินแยกแท็บ">
      <span>↗</span> หน้าแอดมิน
    </a>
  </div>
</header>

<div class="stage-container" id="stage-main">
  <!-- Single Frame (Customer Phone View by default) -->
  <div class="frame-mobile-wrap" id="mobile-frame-box">
    <iframe id="main-iframe" src="index.html"></iframe>
  </div>

  <!-- Fullscreen Desktop Frame -->
  <iframe id="desktop-iframe" class="frame-single" style="display: none;" src="merchant.html"></iframe>

  <!-- Split Screen Mode Container -->
  <div class="stage-split" id="split-container">
    <div class="split-col" style="max-width: 480px;">
      <div class="split-col-header">
        <span style="color: #00B14F; display: flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          1. ลูกค้ากดสั่งอาหาร (Customer App)
        </span>
        <button onclick="document.getElementById('frame-split-customer').src = 'index.html'" style="border:none;background:none;color:#94A3B8;cursor:pointer;font-size:12px;">รีเฟรช ↺</button>
      </div>
      <iframe id="frame-split-customer" src="index.html"></iframe>
    </div>

    <div class="split-col">
      <div class="split-col-header">
        <span style="color: #F59E0B; display: flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          2. ร้านค้าขึ้นออเดอร์สดทันที (Merchant Live Orders)
        </span>
        <button onclick="document.getElementById('frame-split-merchant').src = 'merchant.html'" style="border:none;background:none;color:#94A3B8;cursor:pointer;font-size:12px;">รีเฟรช ↺</button>
      </div>
      <iframe id="frame-split-merchant" src="merchant.html"></iframe>
    </div>
  </div>
</div>

<script>
  function setMode(mode) {
    document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');

    const mobileWrap = document.getElementById('mobile-frame-box');
    const desktopFrame = document.getElementById('desktop-iframe');
    const splitContainer = document.getElementById('split-container');
    const mainIframe = document.getElementById('main-iframe');

    if (mode === 'customer') {
      mobileWrap.style.display = 'block';
      desktopFrame.style.display = 'none';
      splitContainer.style.display = 'none';
      mainIframe.src = 'index.html';
    } else if (mode === 'merchant') {
      mobileWrap.style.display = 'none';
      desktopFrame.style.display = 'block';
      splitContainer.style.display = 'none';
      desktopFrame.src = 'merchant.html';
    } else if (mode === 'admin') {
      mobileWrap.style.display = 'none';
      desktopFrame.style.display = 'block';
      splitContainer.style.display = 'none';
      desktopFrame.src = 'admin.html';
    } else if (mode === 'split') {
      mobileWrap.style.display = 'none';
      desktopFrame.style.display = 'none';
      splitContainer.style.display = 'flex';
      // Sync initial state
      document.getElementById('frame-split-customer').src = 'index.html';
      document.getElementById('frame-split-merchant').src = 'merchant.html';
    }
  }
</script>
</body>
</html>
